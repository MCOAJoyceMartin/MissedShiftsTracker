<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missed Shifts Tracker — PureHealth AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .bar {
    height: 44px; background: #0F1E38; display: flex; align-items: center;
    padding: 0 16px; gap: 10px; flex-shrink: 0;
  }
  .bar a { color: rgba(255,255,255,.7); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .bar a:hover { color: #00A99D; }
  .bar .sep { color: rgba(255,255,255,.25); }
  .bar .title { color: white; font-size: 13px; font-weight: 600; }
  .wrap { height: calc(100% - 44px); position: relative; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
  .loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #F0F4F8; color: #64748B; font-size: 13px; flex-direction: column; gap: 10px;
  }
  .spinner { width: 28px; height: 28px; border: 3px solid #E2E8F0; border-top-color: #00A99D; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="bar">
    <a href="/">← Back to Portal</a>
    <span class="sep">|</span>
    <span class="title">Missed Shifts Tracker</span>
  </div>
  <div class="wrap">
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <div>Loading Missed Shifts Tracker…</div>
    </div>
    <iframe id="appFrame" title="Missed Shifts Tracker"
      onload="document.getElementById('loadingState').style.display='none'"></iframe>
  </div>

<script>
  // The portal hands off the signed-in user as a `phs` token on this page's
  // own URL (e.g. /missed-shifts/?phs=...) — this page is same-origin with
  // the portal, so it could read sessionStorage directly instead, but the
  // token is already there and it keeps this wrapper decoupled from the
  // portal's storage key names. Forward the same token straight through to
  // the real tracker (loaded in the iframe, still on its own github.io
  // origin) so it can run its own checkURLSession() exactly as it does when
  // linked to directly.
  const TRACKER_URL = 'https://mcoajoycemartin.github.io/MissedShiftsTracker/';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('phs');

  const frame = document.getElementById('appFrame');
  frame.src = token ? (TRACKER_URL + '?phs=' + encodeURIComponent(token)) : TRACKER_URL;

  // Strip the token from this page's own visible URL right away, same as
  // the tracker does for itself — it should never sit there or get
  // bookmarked with a live credential payload in it.
  if (token) {
    window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
  }
</script>
</body>
</html>
